  desc:
    zh: 感溫變色的食物痠痛貼布獲台灣區金獎與國際決賽優秀獎。畢業製作則讓灰塵附著在路燈旗上，隨累積量改變圖樣，呈現空氣污染，入圍金點設計獎。
    en: A food-themed pain-relief patch that changes colour with body heat won the Gold Award in the Taiwan round and an Excellence Award at the international final. The graduation project collected dust on street-lamp banners, changing their pictures as it built up to make air pollution visible, and was a Golden Pin Design Award finalist.
