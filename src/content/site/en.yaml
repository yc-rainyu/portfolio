about:
  bio:
    - Over five years of front-end development experience at Neutec, progressing to Senior Front-end Engineer. Led the front-end architecture of a risk-management system adopted by three product lines and built the front end and tracking layer of a user analytics platform handling millions of events a day.
    - Studied visual communication design before working as a web designer and front-end engineer. Completed an MSc in Computer Science at the University of Birmingham in 2026 with Distinction, researching cross-game bot detection from mouse trajectories. Built and deployed SpotClue and Job Sponsor Tracker with Python and PostgreSQL, covering data pipelines, browser-based inference and application deployment.
  educationTitle: Education
  education:
    - school: University of Birmingham, UK
      degree: MSc, Computer Science
      period: 2025–2026
      note: Distinction (81.7%)
    - school: National Taiwan University of Arts, Taiwan
      degree: BFA, Visual Communication Design
      period: 2013–2017
  awardsTitle: Awards and activities
  awards:
    - title: SPARK 2025 Coding Challenge
      org: GSA Capital
      date: Dec. 2025
      desc: 21-day coding and quantitative challenge. Scored 34/35.
    - title: voting-guide.tw
      org: g0v Taiwan civic tech community
      date: Feb. 2023
      desc: Contributed to the front-end development of voting-guide.tw, an open-source pre-election information site.
    - title: Lidemy Mentor Program
      org: Lidemy
      date: Apr. 2020
      desc: Completed a four-month software engineering programme involving over 40 hours of study each week.
    - title: The F2E Front-end Challenge
      org: Hexschool
      date: Jul. 2019
      desc: A nine-week challenge. Built a web interface on a new theme each week and submitted it by the weekly deadline.
    - title: Golden Pin Design Award (Finalist)
      org: Taiwan Design Research Institute
      date: Apr. 2017
    - title: Excellence Award (international final)
      org: ASPaC and Japan Package Design Association (JPDA)
      date: Jan. 2017
    - title: Gold Award (Taiwan round)
