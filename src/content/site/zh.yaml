about:
  bio:
    - 在日新軟體從事五年以上前端開發，期間升任資深前端工程師。主導過三條產品線採用的風控系統前端架構，也負責每日處理數百萬筆事件的使用者分析平台前端與追蹤層。
    - 大學主修視覺傳達設計，先後擔任網頁設計師與前端工程師，2026 年以 Distinction 完成英國伯明罕大學電腦科學碩士。論文以滑鼠軌跡研究跨遊戲機器人偵測；個人專案 SpotClue 與 Job Sponsor Tracker 則以 Python、PostgreSQL 開發並上線，涵蓋資料處理、瀏覽器端模型推論與應用部署。
  educationTitle: 學歷
  education:
    - school: 英國伯明罕大學 University of Birmingham
      degree: 電腦科學碩士
      period: 2025–2026
      note: Distinction（英國制最高等第）
    - school: 國立臺灣藝術大學
      degree: 視覺傳達設計學士
      period: 2013–2017
  awardsTitle: 獎項與活動
  awards:
    - title: SPARK 2025 程式挑戰賽
      org: GSA Capital
      date: 2025 年 12 月
      desc: 由英國量化交易公司 GSA Capital 舉辦的 21 天程式與量化挑戰，得分 34／35。
    - title: 選前大補帖 voting-guide.tw
      org: g0v 零時政府
      date: 2023 年 2 月
      desc: 參與開源專案資訊網站選前大補帖的前端開發。
    - title: 程式導師實驗計畫
      org: Lidemy 鋰學院
      date: 2020 年 4 月
      desc: 完成為期四個月的軟體工程訓練，每週投入 40 小時以上。
    - title: The F2E 前端修煉精神時光屋
      org: 六角學院
      date: 2019 年 7 月
      desc: 為期九週的挑戰，每週依新主題完成一個網頁介面，並在當週期限內提交。
    - title: 金點設計獎 入圍
      org: 台灣設計研究院
      date: 2017 年 4 月
    - title: 國際決賽 優秀獎
      org: ASPaC 亞洲學生包裝設計競賽、日本包裝設計協會（JPDA）
      date: 2017 年 1 月
    - title: 台灣區 金獎
      org: ASPaC 亞洲學生包裝設計競賽
      date: 2016 年 11 月
