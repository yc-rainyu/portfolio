about:
  bio:
    - zh: 在日新軟體從事五年以上前端開發，期間升任資深前端工程師，主導風控系統的前端架構，系統後續由三條產品線採用。也負責使用者行為分析平台的前端與追蹤層，平台每日處理數百萬筆事件。
      en: Worked in front-end development at Neutec for over five years, progressing to Senior Front-end Engineer. Led the front-end architecture of a risk-management system later adopted by three product lines, and built the front end and tracking layer of a user behaviour analytics platform handling millions of events a day.
    - zh: 大學主修視覺傳達設計，畢業後先後擔任網頁設計師與前端工程師。2026 年以 Distinction 取得英國伯明罕大學電腦科學碩士學位，碩士論文研究以滑鼠軌跡跨遊戲偵測機器人。個人專案 SpotClue 與 Job Sponsor Tracker 使用 Python、PostgreSQL 開發並上線，涵蓋資料處理、瀏覽器端模型推論與應用部署。
      en: Studied visual communication design before working as a web designer and front-end engineer. Completed an MSc in Computer Science at the University of Birmingham in 2026 with Distinction, researching cross-game bot detection from mouse trajectories. Built and deployed SpotClue and Job Sponsor Tracker with Python and PostgreSQL, covering data processing, browser-based inference and application deployment.
